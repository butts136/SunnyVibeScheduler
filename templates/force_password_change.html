<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nouveau mot de passe requis | Sunny Vibe Nutrition</title>
  <link rel="icon" href="{{ url_for('favicon') }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png', v=styles_version) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v=styles_version) }}">
</head>
<body data-ui-mode="dark" data-theme="modern-gradient" class="with-left-nav auth-page-body force-password-change-body">
  <div class="layout app-layout">
    {% include '_left_nav.html' %}
    <div class="page">
      <div class="card form-card">
      <h1>Nouveau mot de passe requis</h1>
      <p class="subtitle">Votre mot de passe temporaire doit être remplacé pour continuer.</p>

      {% if errors %}
      <div class="alert error">
        <ul>
          {% for error in errors %}
          <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endif %}

      <form method="post" class="form-grid" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label class="full-width">
          Nouveau mot de passe
          <input type="password" name="new_password" minlength="8" required>
        </label>

        <label class="full-width">
          Confirmation du nouveau mot de passe
          <input type="password" name="new_password_confirm" minlength="8" required>
        </label>

        <div class="full-width actions">
          <button class="btn primary" type="submit">Mettre à jour</button>
          <a class="btn" href="{{ url_for('logout') }}">Se déconnecter</a>
        </div>
      </form>
      </div>
    </div>
  </div>
</body>
</html>
