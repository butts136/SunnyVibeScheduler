<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Initialisation Admin | Sunny Vibe Nutrition</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="with-left-nav">
  <div class="app-layout">
    {% include '_left_nav.html' %}
    <div class="page">
      <div class="card form-card">
      <h1>Création du compte administrateur</h1>
      <p class="subtitle">Première exécution détectée. Ce compte sera stocké dans un fichier JSON chiffré.</p>

      {% if errors %}
      <div class="alert error">
        <ul>
          {% for error in errors %}
          <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endif %}

      <form method="post" class="form-grid" novalidate>
        <label class="full-width">
          Courriel administrateur
          <input type="email" name="identifier" value="{{ form_data.identifier }}" required>
        </label>

        <label>
          Mot de passe administrateur
          <input type="password" name="password" minlength="8" required>
        </label>

        <label>
          Confirmation du mot de passe
          <input type="password" name="password_confirm" minlength="8" required>
        </label>

        <div class="full-width actions">
          <button class="btn primary" type="submit">Créer le compte admin</button>
          <a class="btn" href="{{ url_for('index') }}">Retour</a>
        </div>
      </form>
      </div>
    </div>
  </div>
</body>
</html>
